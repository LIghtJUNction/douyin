name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKGRS_DYNAMIC: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup update stable

      - name: Install SQLite (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install sqlite3:x64-windows
          $sqlite = "$env:VCPKG_ROOT\installed\x64-windows"
          if (-not (Test-Path "$sqlite\lib\sqlite3.lib")) { throw "sqlite3.lib is missing" }
          "SQLITE3_LIB_DIR=$sqlite\lib" >> $env:GITHUB_ENV
          "SQLITE3_INCLUDE_DIR=$sqlite\include" >> $env:GITHUB_ENV
          "$sqlite\bin" >> $env:GITHUB_PATH

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test --locked

      - name: Test phone bridge
        run: node tools/test-phone-agent.mjs

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify CLI
        run: cargo run --locked -- --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup update stable
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify publishable package
        run: cargo package --locked
