[package]
name = "douyin-cli"
version = "2026.11.15"
edition = "2024"
rust-version = "1.100"
description = "A Rust CLI reproducing Douyin Android workflows and livestreaming"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LIghtJUNction/douyin"
exclude = [
    "packaging/**",
    "unsloth_compiled_cache/**",
]

[features]
default = []

[[bin]]
name = "douyin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
base64 = "0.23.1"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query", "form", "multipart", "gzip"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sm3 = "0.5"
url = "2.5.8"
quick-xml = "0.42.0"
tempfile = "3.27.0"
tiny_http = "0.12.0"
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.54.1", features = ["rt", "io-std", "time", "net", "signal", "sync"] }
tokio-util = { version = "0.7.20", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
frida = { version = "0.17.2", features = ["auto-download"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
md-5 = "0.10.6"
obws = "0.15.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = { version = "0.42.0", default-features = false, features = ["libsqlite3-sys", "bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.42.0", default-features = false, features = ["libsqlite3-sys"] }

[profile.release]
lto = "thin"
strip = "symbols"
